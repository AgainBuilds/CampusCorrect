
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#ffffff">

    <meta name="description"
          content="CampusCorrect helps Federal University Otuoke students access academic materials and resources with less stress.">

    <title>
        {% block title %}CampusCorrect — Get ahead academically{% endblock %}
    </title>

    <link rel="stylesheet"
          href="/static/style.css?v=20261122-2">

    {% block extra_head %}{% endblock %}
</head>

<body>

    <header class="site-header">

        <a href="/" class="brand">

            <span class="brand-mark">CC.</span>

            <span>CampusCorrect</span>

        </a>

        <nav class="header-links">

            <a href="/">Home</a>

            <a href="/about">About</a>

            <a href="/contributions">Contributions</a>

    <main class="site-main">

        {% block content %}{% endblock %}

    </main>


    <footer class="site-footer">

        <div class="footer-brand">
            CampusCorrect.
        </div>

        <p>
            Get ahead academically with less stress.
        </p>

            Federal University Otuoke
        </p>

    {% block scripts %}{% endblock %}
